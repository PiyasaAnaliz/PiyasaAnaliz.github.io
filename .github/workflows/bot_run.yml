name: Market Bot Run

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı otomatik çalışır
  workflow_dispatch: # İstediğinde manuel başlatma butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot finnhub-python requests

    - name: Botu Çalıştır
      run: python piyasa_analizim_bot.py
      
